name: Create Release with Webpack Build on Main Push

on:
  push:
    branches:
      - main
    paths:
      - 'src/manifest.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Webpack production build
        run: npm run build:prod

      - name: Extract version from manifest and generate tags
        id: vars
        run: |
          # Read the version field from src/manifest.json using jq
          VERSION=$(jq -r '.version' src/manifest.json)

          # Output variables for use in later steps
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v-${VERSION}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create ZIP archive of dist folder
        run: |
          cd dist
          zip -r ../godsight-v${{ steps.vars.outputs.version }}.zip .
          cd ..

      - name: Create GitHub Release and Attach Artifact
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd #v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.vars.outputs.tag }}
          # Appends the extracted version directly to the release name
          name: Release v${{ steps.vars.outputs.version }} (${{ steps.vars.outputs.date }})
          generateReleaseNotes: true
          draft: false
          prerelease: false
          artifacts: 'godsight-v${{ steps.vars.outputs.version }}.zip'
